{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-n2m p-4">
        <h1 class="h3 text-white mb-4">Check your email</h1>
        <p class="text-muted">If an account exists for that address, we've sent a password reset link. Check your inbox and spam folder.</p>
        <p class="mt-4 mb-0 text-muted small"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
