{% extends "base.html" %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-n2m p-4">
        <h1 class="h3 text-white mb-4">Password reset complete</h1>
        <p class="text-muted">Your password has been set. You can sign in now.</p>
        <p class="mt-4 mb-0"><a href="{% url 'accounts:login' %}" class="btn btn-n2m">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
