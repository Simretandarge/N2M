{% extends "base.html" %}
{% load static %}

{% block title %}Delete post{% endblock %}
{% block meta_description %}Confirm delete.{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="h2 text-white mb-4">Delete post</h1>
  <div class="card card-n2m p-4">
    <p class="text-white mb-4">Are you sure you want to delete <strong>{{ post.title }}</strong>? This cannot be undone.</p>
    <form method="post" action="{% url 'content:manage_post_delete' post.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger me-2">Delete</button>
      <a href="{% url 'content:manage_post_list' %}" class="btn btn-outline-n2m">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
